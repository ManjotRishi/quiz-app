name: Generate Quiz

on:
  schedule:
    - cron: "*/5 * * * *"   
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Run quiz generator
        run: |
          cd scripts
          node generateQuiz.js